name: Deploy to GitHub Pages

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          curl -fsSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C /usr/local/bin

      - name: Create output directory
        run: mkdir -p ${{ github.workspace }}/site

      - name: Build Chinese (zh)
        run: mdbook build ${{ github.workspace }}/book-zh --dest-dir ${{ github.workspace }}/site/zh

      - name: Build English (en)
        run: mdbook build ${{ github.workspace }}/book-en --dest-dir ${{ github.workspace }}/site/en

      - name: Copy root index
        run: cp ${{ github.workspace }}/index.html ${{ github.workspace }}/site/

      - name: Copy robots.txt
        run: cp ${{ github.workspace }}/robots.txt ${{ github.workspace }}/site/

      - name: Generate sitemap
        run: python3 ${{ github.workspace }}/scripts/generate-sitemap.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
