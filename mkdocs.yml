# SPDX-License-Identifier: MulanPSL-2.0 OR Unlicense
site_name: K4m7v2pz's Blog
site_url: https://k4m7v2pz.github.io
site_author: k4m7v2pz
site_description: k4m7v2pz 的博客

repo_name: k4m7v2pz/k4m7v2pz.github.io
repo_url: https://github.com/k4m7v2pz/k4m7v2pz.github.io

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - header.autohide
  navigation:
    previous: false
    next: false
  hide:
    - footer

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.mark
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - rss:
      match_path: blog/.*
      date_from_meta:
        as_creation: date
        as_update: date
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
          site_name: "K4m7v2pz's Blog"
          site_description: k4m7v2pz 的博客
          nav:
            - 首页: zh/index.md
            - 操作系统:
                - GNU/Linux:
                    - 在 Ubuntu 衍生版上安装 Google 拼音: zh/blog/operating-system/gnulinux/google-pinyin-installation-ubuntu-derivatives.md
                    - CentOS 7 跳板 DD 安装 Debian 12: zh/blog/operating-system/gnulinux/centos7-jumpbox-dd-debian12-vps.md
                - Windows:
                    - 嵌入式 Python Windows 版 pip 安装: zh/blog/operating-system/windows/embed-python-pip-installation-windows.md
                    - 7-Zip SFX 标准 Stub 选型: zh/blog/operating-system/windows/7zip-sfx-stub-selection.md
                    - 修复 RunProgram 失效: zh/blog/operating-system/windows/fix-7zip-sfx-runprogram-failure.md
                    - LLM 静默部署 EXE: zh/blog/operating-system/windows/llm-deploy-silent-7zip-sfx.md
                    - 设置 Zed 为 bat 编辑器: zh/blog/operating-system/windows/set-zed-as-bat-editor.md
            - 工具:
                - Nushell + AtomCode 配置踩坑记录: zh/blog/tools/nushell-atomcode-config-pitfalls.md
                - WezTerm + Nushell + Cargo 找不到命令: zh/blog/tools/wezterm-nushell-cargo-not-found.md
            - 编程开发:
                - Rust Bevy 0.13 到 0.14 升级踩坑指南: zh/blog/programming/rust-bevy-0.13-to-0.14-upgrade-guide.md
            - 游戏:
                - Mighty Rodent Splash 黑屏踩坑记录: zh/blog/games/mighty-rodent-splash-black-screen-debug.md
            - Suno AI:
                - 红警 2 黄色警戒 主菜单音乐 Suno AI 风格提示词: zh/blog/sunoai/yellow-alert-suno-style-prompt.md
            - 关于: zh/about.md
        - locale: en
          name: English
          build: true
          site_name: "K4m7v2pz's Blog"
          site_description: k4m7v2pz's personal blog
          nav:
            - Home: en/index.md
            - Operating System:
                - GNU/Linux:
                    - Install Google Pinyin on Ubuntu Derivatives: en/blog/operating-system/gnulinux/google-pinyin-installation-ubuntu-derivatives.md
                    - DD Install Debian 12 on a Cheap VPS Using CentOS 7: en/blog/operating-system/gnulinux/centos7-jumpbox-dd-debian12-vps.md
                - Windows:
                    - Embedded Python pip Installation: en/blog/operating-system/windows/embed-python-pip-installation-windows.md
                    - 7-Zip SFX Standard Stub Selection: en/blog/operating-system/windows/7zip-sfx-stub-selection.md
                    - Fix RunProgram Failure: en/blog/operating-system/windows/fix-7zip-sfx-runprogram-failure.md
                    - LLM Silent EXE Deployment: en/blog/operating-system/windows/llm-deploy-silent-7zip-sfx.md
                    - Set Zed as bat Editor: en/blog/operating-system/windows/set-zed-as-bat-editor.md
            - Tools:
                - Nushell + AtomCode Configuration Pitfalls: en/blog/tools/nushell-atomcode-config-pitfalls.md
                - WezTerm + Nushell + Cargo Not Found: en/blog/tools/wezterm-nushell-cargo-not-found.md
            - Programming:
                - Rust Bevy 0.13 to 0.14 Upgrade Guide: en/blog/programming/rust-bevy-0.13-to-0.14-upgrade-guide.md
            - Games:
                - Debugging Black Screen on Mighty Rodent Splash Screen: en/blog/games/mighty-rodent-splash-black-screen-debug.md
            - Suno AI:
                - Red Alert 2 Yellow Alert Main Menu Music — Suno AI Style Prompt: en/blog/sunoai/yellow-alert-suno-style-prompt.md
            - About: en/about.md
